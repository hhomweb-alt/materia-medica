#tickin{max-width:680px;margin:0 auto}

.flash{animation:fl .45s}@keyframes fl{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#ticklog{display:none;max-height:42vh;overflow-y:auto;padding:4px 14px 6px;font-size:12.5px;border-bottom:1px solid var(--line)}

main{padding-bottom:110px!important}

  const box=m.querySelector('.opts');
  OPTS(s).forEach(o=>{
    const b=document.createElement('button');b.className='opt'+(sel.includes(o.k)?' sel':'');
    const d=document.createElement('div');d.textContent=o.l;if(o.s){const sm=document.createElement('small');sm.textContent=o.s;d.appendChild(sm)}
    b.appendChild(d);
    b.onclick=()=>{
      if(!s.multi){A[s.id]=[o.k];if(s.id==='c')delete A.loc;next();return}
      let a=A[s.id]||[];a=a.includes(o.k)?a.filter(x=>x!==o.k):[...a,o.k];A[s.id]=a;render();
    };box.appendChild(b);
  });
  const nav=m.querySelector('.nav');
  const bk=document.createElement('button');bk.className='btn g';bk.textContent='Back';bk.onclick=()=>{if(i>0){i--;log('Stepped back to question '+(i+1)+'. Your earlier answers are kept and can be changed.','nav')}else mode=null;render()};nav.appendChild(bk);
  if(s.multi){const nx=document.createElement('button');nx.className='btn';nx.textContent=sel.length?'Next':'Skip';nx.onclick=next;nav.appendChild(nx)}
}
function next(){logAnswer(STEPS[i]);if(++i>=STEPS.length)return results();render()}
function score(){
  let max=0;STEPS.forEach(s=>{const n=(A[s.id]||[]).length;if(n)max+=s.w*(s.multi?Math.min(n,2):1)});
  return R.map(r=>{let sc=0;STEPS.forEach(s=>{const a=A[s.id]||[];let h=a.filter(x=>(r[s.k]||[]).includes(x)).length;if(s.multi)h=Math.min(h,2);sc+=h*s.w});return{r,pct:max?Math.round(sc/max*100):0}}).sort((a,b)=>b.pct-a.pct);
}
function P(parent,label,text){const p=document.createElement('p');if(label){const l=document.createElement('span');l.className='lbl';l.textContent=label+' ';p.appendChild(l)}p.appendChild(document.createTextNode(text));parent.appendChild(p);return p}
function results(){
  $('bar').style.width='100%';const all=score();topR=all.slice(0,3);
  const m=$('main');
  m.innerHTML='<h2></h2><div class="card" id="sum"></div><h2 style="font-size:18px">Ranked remedy fit</h2><div id="cards"></div><div id="aibox"></div><div class="card" id="meth"></div><div class="nav"><button class="btn g" id="rs">Start over</button></div>';
  m.querySelector('h2').textContent=cfg.name+' case analysis';
  const sum=$('sum');
  STEPS.forEach(st=>{const a=A[st.id]||[];if(a.length)P(sum,st.sec+':',a.map(k=>lab(st,k)).join(', '))});
  P(sum,'Methodology:',METHS[methId].name);
  const gap=topR[0].pct-topR[1].pct;
  P(sum,'Reading:',gap<=10?'The top two are within '+gap+' points, so the picture does not yet separate them. Use the confirming questions below before deciding.':'The leading remedy is '+gap+' points clear of the next, but the label reflects fit to the profiles only.');
  topR.forEach(({r,pct},n)=>{
    const c=document.createElement('div');c.className='card';
    const fl=pct>=70?'Strong fit':pct>=45?'Moderate fit':'Weak fit';
    const h=document.createElement('h3');h.textContent=(n+1)+'. '+r.n;const f=document.createElement('span');f.className='fit';f.textContent=fl+' \u00b7 '+pct+'%';h.appendChild(f);c.appendChild(h);
    const hit=[],miss=[];
    STEPS.forEach(st=>{if(!st.w)return;const a=A[st.id]||[];const h1=a.filter(k=>(r[st.k]||[]).includes(k)).map(k=>lab(st,k)),x=a.filter(k=>!(r[st.k]||[]).includes(k)).map(k=>lab(st,k));if(h1.length)hit.push(st.sec+': '+h1.join(' / '));if(x.length)miss.push(st.sec+': '+x.join(' / '))});
    P(c,'Keynotes:',r.k);P(c,'Modalities:',r.m);
    P(c,'Matches the case:',hit.length?hit.join('; '):'none of the selected features');
    P(c,'Not in this remedy profile:',miss.length?miss.join('; ')+'. Weigh these against the remedy before prescribing.':'nothing contradicts the profile.');
    P(c,'Confirm by asking:',r.q);P(c,'Differentiate from:',r.d);
    P(c,'Traditional use:',r.u+(cfg.pot?'. Commonly sold as 6C or 30C; potency and repetition are the practitioner decision.':'. Potency, repetition and follow-up are the practitioner decision.'));
    $('cards').appendChild(c);
  });
  P(sum,'Also scoring:',all.slice(3,5).map(x=>x.r.n+' ('+x.pct+'%)').join(', '));
  if(mode==='chronic'&&((A.fh||[]).length||(A.mi||[]).length)){const cnt={};(A.fh||[]).forEach(k=>(FHM[k]||[]).forEach(x=>cnt[x]=(cnt[x]||0)+1));(A.mi||[]).forEach(x=>cnt[x]=(cnt[x]||0)+1);const ent=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);P(sum,'Miasmatic leaning (five-miasm framework):',ent.map(([x,n])=>x+' ('+n+')').join(', ')+'. Counts combine family history and the features you selected.');if(ent.length){const tp=ent.filter(e=>e[1]===ent[0][1]);P(sum,tp.length>1?'Tied leading pictures:':'Leading picture:',tp.map(e=>MIAS[e[0]]).join('; ')+'. Authors assign conditions to miasms differently, so treat this as a prompt for history-taking and follow-up, not a finding. It is not used in the scoring.')}}
  const me=$('meth');
  P(me,'Method and limits:',cfg.method+' Methodology: '+METHS[methId].name+'. '+METHS[methId].desc+' Weights in use: '+STEPS.filter(x=>x.w).map(x=>x.sec+' x'+x.w).join(', ')+'.'+' Fit labels: strong 70% or more, moderate 45 to 69%, weak below 45%. Location, severity, duration and family history are recorded in the case summary and the AI analysis but are not scored, because the profiles do not yet carry regional data. This is symptom-level matching, not full repertorisation of the totality. It does not weigh strange, rare and peculiar symptoms, miasmatic background or the direction of cure, and it covers a small remedy set. Verify every remedy against your own materia medica before prescribing.');
  if(!cfg.pot)P(me,'Chronic follow-up:','Confirm mental generals, thermal state and food desires against a full case history, and plan review of the response and direction of cure.');
  $('rs').onclick=()=>{mode=null;A={};i=0;render()};
  const gp=topR[0].pct-topR[1].pct;
  log('Case complete. Remedies are ranked by how closely their picture matches what you entered. Closest: '+topR.map(x=>short(x.r.n)).join(', ')+'. '+(gp<=10?'The top two are close, so use the confirming questions to separate them.':short(topR[0].r.n)+' is clearly ahead.'),'rank');
  addAI();
}
async function addAI(){
  let sample=null;try{sample=await window.claude?.use('sample')}catch(e){}
  if(!sample)return;
  const b=document.createElement('button');b.className='btn';b.textContent='\u2728 Full differential analysis with AI';b.style.marginBottom='12px';
  $('aibox').appendChild(b);
  b.onclick=async()=>{
    b.disabled=true;b.textContent='Thinking\u2026';
    const out=document.createElement('div');out.className='card ai';$('aibox').appendChild(out);
    const picture=STEPS.map(s=>s.t+' '+(A[s.id]||[]).map(k=>lab(s,k)).join(', ')).join('\n');
    const prompt=`You are assisting a homeopathy student or practitioner with a ${mode} case, using ${cfg.src} profiles and the ${METHS[methId].name} methodology (${METHS[methId].desc}). Using homeopathic terminology (keynotes, modalities, generals and particulars, aetiology, rubrics${mode==='chronic'?', constitution, miasmatic background, direction of cure':''}), write about 250 words of plain text with no markdown symbols, in four short labelled paragraphs: Rationale for the ranking; Key differentiating features; Two or three follow-up questions to ask the patient; Limitations of this data. Ground the answer in the profiles supplied. Do not diagnose in conventional terms, do not invent quotations or page references, and name standard materia medica only in general terms.\nPatient picture:\n${picture}\nCandidate profiles:\n${topR.map(t=>t.r.n+' ('+t.pct+'%): '+t.r.k+' '+t.r.m).join('\n')}`;
    try{const r=await sample(prompt,{cache:false,onText:({text})=>{out.textContent=text}});out.textContent=r.text||out.textContent;b.remove()}
    catch(e){out.textContent=(e&&e.text)||'The AI analysis is unavailable right now.';b.remove()}
  };
}
render();
</script>
